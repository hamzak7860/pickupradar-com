# Venue share pages (v/<venue-id>/) on pickupradar.com for WhatsApp and other link previews.
# This is the pickupradar-com repository. pickupradar.co.uk has its own copy of this
# workflow in hamzak7860/pickupradar-site; the two never touch each other's files.
# Cities: the live cities in preview.js (SITE_CITIES), now Milton Keynes and Chicago.
#
# Test run (default): Actions > Venue share pages > Run workflow. It builds every
# page and image from public venue data and uploads them as a download
# ("venue-pages") for review. Nothing is committed.
#
# Publish: run it again with "Commit the pages" ticked. It commits only what changed,
# then asks GitHub Pages to rebuild the site. (A commit made by a workflow does not
# start a Pages build by itself, so the workflow requests one, the same as a push.)
#
# Safety: the build stops without changes if the venue list looks incomplete
# (API error, totals that do not add up, far fewer venues than before, or more
# than 10 pages / 5% of a city's pages to remove).
#
# Daily: runs every morning and publishes only what changed (new, renamed or
# no-longer-active venues). If the safety checks stop a run, nothing is changed
# and GitHub emails the repository owner that the run failed.

name: Venue share pages (.com)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Commit the pages to main (leave unticked for a test run)
        type: boolean
        default: false
  schedule:
    - cron: '47 4 * * *' # every day at 04:47 UTC, 30 minutes after the .co.uk run

concurrency:
  group: venue-pages-com
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04 # pinned: Playwright 1.55 cannot install its browser dependencies on Ubuntu 26
    timeout-minutes: 120 # first run draws about 5,700 images
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Only used to draw the 1200x630 images. Not saved in the repository.
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      # Uses the public venue list (the same public key as the live preview).
      - name: Build venue pages
        run: node tools/venue-pages.js --fetch --images --prune

      - name: Check venue pages
        run: node tools/venue-pages.js --check

      - name: Summary
        run: |
          pages=$(find v -mindepth 1 -maxdepth 1 -type d | wc -l)
          size=$(du -sh v | cut -f1)
          changed=$(git status --porcelain -- v | wc -l)
          {
            echo "### Venue share pages"
            echo "- Pages: $pages"
            echo "- Size of v/: $size"
            echo "- Files changed compared with main: $changed"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: venue-pages
          path: v/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'schedule' || inputs.publish
    runs-on: ubuntu-24.04 # pinned: Playwright 1.55 cannot install its browser dependencies on Ubuntu 26
    timeout-minutes: 40
    permissions:
      contents: write
      pages: write
    steps:
      # Start from the newest main (not the commit the run began on), with enough
      # history for the rebase below.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 20

      - name: Replace v/ with the new pages
        run: rm -rf v

      - uses: actions/download-artifact@v7
        with:
          name: venue-pages
          path: v/

      - name: Commit only if something changed
        run: |
          git add -A v
          if git diff --cached --quiet; then
            echo "No changes to venue pages."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Venue share pages: update from public venue list"
          # main may have moved while the pages were being built (for example a website
          # commit). This commit only touches v/, so rebase it onto the latest main and
          # push. Never force-push. Gives up after 5 attempts.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed=yes" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Push rejected (attempt $attempt). Rebasing onto the latest main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Rebase failed: someone else changed v/. Stopping without pushing."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "Could not push after 5 attempts."
          exit 1

      # Same effect as pushing to main: GitHub Pages rebuilds from the latest commit.
      - name: Ask GitHub Pages to rebuild
        if: env.pushed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq .status
          head=$(git rev-parse HEAD)
          for i in $(seq 1 120); do
            sleep 10
            build=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.status + " " + .commit')
            echo "Pages build: $build"
            if [ "$build" = "built $head" ]; then exit 0; fi
            case "$build" in errored*) echo "The Pages build failed."; exit 1;; esac
          done
          echo "The Pages build did not finish in 20 minutes. Check Actions > pages-build-deployment."
          exit 1
